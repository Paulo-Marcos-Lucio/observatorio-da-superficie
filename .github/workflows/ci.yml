name: Invariantes

on:
  push:
    branches: [main]
    paths-ignore:
      - "dados/**"
      - "diario/**"
      - "README.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invariantes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - run: pip install -r requisitos-dev.txt

      - name: Testes
        run: python -m pytest testes/ -q

      - name: Lint
        run: ruff check coletor testes

      - name: Formatação
        run: ruff format --check coletor testes

  coleta-a-seco:
    # O coletor precisa continuar importável e executável mesmo que a rede
    # falhe — isto é testado chamando `observar()` em processo, sem passar
    # pelo CLI: uma sonda nunca pode propagar exceção (doutrina: nenhuma sonda
    # devolve silêncio), e isso vale INDEPENDENTE de quantos alvos estão
    # sendo coletados.
    #
    # O CLI completo é testado separadamente: um alvo só, 100% inconclusivo,
    # é exatamente o cenário que o piso de conclusividade (CAMPO-08) existe
    # para recusar — a coleta não deve gravar nada nem sair com 0. Antes de
    # CAMPO-08 este job esperava sair 0; o piso mudou essa doutrina de
    # propósito, então o job passou a testar a recusa, não mais o sucesso.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Sonda não propaga exceção para um alvo que não resolve
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys

          sys.path.insert(0, "coletor")
          import coleta

          alvo = {"host": "alvo-que-nao-existe.invalid", "classe": "proprio"}
          observacao = coleta.observar(alvo)
          sondas = {s["sonda"]: s for s in observacao["sondas"]}

          # As sondas que precisam falar com o host não têm como concluir nada
          # sobre um domínio que não resolve.
          for nome in ("porta80", "cabecalhos", "tls", "security_txt"):
              assert sondas[nome]["status"] == "inconclusivo", (nome, sondas[nome])

          # A de DNS, por outro lado, CONCLUI: perguntar ao resolvedor e receber
          # "não há registro para este nome" é uma medição bem-sucedida. Exigir
          # `inconclusivo` aqui seria repetir, no teste, exatamente a confusão
          # entre não-medir e medir-e-não-achar que o projeto existe para evitar.
          assert sondas["dns"]["status"] in {"ok", "inconclusivo"}
          if sondas["dns"]["status"] == "ok":
              assert sondas["dns"]["a"] == [], "domínio .invalid não pode ter registro A"

          for nome, sonda in sondas.items():
              if sonda["status"] == "inconclusivo":
                  assert sonda.get("motivo"), f"{nome}: inconclusivo sem motivo é silêncio"

          assert observacao["postura"]["nota"] is None, "alvo inalcançável não pode ter nota"
          print("ok — alvo inalcançável vira inconclusivo com motivo, sem nota (sonda não explode)")
          PY

      - name: Coleta 100% inconclusiva é recusada, não comitada como sucesso
        run: |
          set -uo pipefail
          printf -- '- host: alvo-que-nao-existe.invalid\n  classe: proprio\n  justificativa: "teste"\n' > /tmp/alvos-teste.yml

          codigo=0
          python coletor/coleta.py --alvos /tmp/alvos-teste.yml --saida /tmp/dados-teste-piso || codigo=$?

          if [ "$codigo" -eq 0 ]; then
            echo "::error::coleta de um alvo 100% inconclusivo deveria ter sido recusada pelo piso de conclusividade"
            exit 1
          fi
          if [ -e /tmp/dados-teste-piso ]; then
            echo "::error::coleta recusada pelo piso não deveria ter escrito nada em --saida"
            exit 1
          fi
          echo "ok — coleta 100% inconclusiva foi recusada (saída ${codigo}), nada escrito em --saida"
