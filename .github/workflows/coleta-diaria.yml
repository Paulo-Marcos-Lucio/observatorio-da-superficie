name: Coleta

# Coleta de hora em hora.
#
# A resolução temporal é o produto aqui. Uma amostra a cada doze horas não
# distingue "o cabeçalho sumiu" de "o cabeçalho sumiu e voltou" — e é
# exatamente nessa janela que mora o deploy revertido às pressas, que é o
# evento mais informativo que um observatório de superfície pode registrar.
# Com uma hora, uma janela de manutenção aparece na série em vez de passar
# entre duas medições.
#
# Custo para o alvo: 4 requisições HTTP por coleta, 96 por dia. Um serviço de
# monitoramento comum bate a cada cinco minutos (288/dia só de HTTP); carregar
# a página inicial uma vez num navegador dispara mais requisições do que uma
# coleta inteira.
#
# O crt.sh fica de fora da coleta horária: é serviço comunitário gratuito, e
# certificado novo não aparece de hora em hora. Ele roda uma vez por dia, na
# coleta marcada como completa.
#
# O instantâneo com os cabeçalhos inteiros só é gravado quando algo muda. A
# série compacta registra todas as horas. Sem isso seriam 193 MB por ano de
# histórico permanente só para dizer que nada aconteceu.
on:
  schedule:
    # De hora em hora, no minuto 23 — longe do :00, onde o mundo inteiro agenda
    # e a fila do GitHub atrasa mais.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      host:
        description: "Observar só este host (vazio = todos)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  observar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Coletar
        # O input vai por ambiente, nunca por interpolação dentro do `run:`.
        # `${{ inputs.host }}` é substituído como TEXTO pelo runner antes de o
        # bash existir: um host como `x"; curl … | sh; #` viraria comando. É a
        # classe de injeção que o hardening guide do GitHub descreve, e num
        # job com `contents: write` ela entrega o token de escrita do repo.
        env:
          HOST: ${{ inputs.host }}
        run: |
          # A coleta das 03h UTC é a completa do dia: roda também o crt.sh e
          # grava o instantâneo mesmo sem mudança, para a série ter uma linha
          # de base diária com os cabeçalhos inteiros.
          COMPLETA=""
          if [ "$(date -u +%H)" = "03" ]; then
            COMPLETA="--completa"
            echo "::notice::coleta completa do dia (inclui Transparência de Certificados)"
          fi

          if [ -n "${HOST:-}" ]; then
            python coletor/coleta.py --host "$HOST" $COMPLETA
          else
            python coletor/coleta.py $COMPLETA
          fi

      - name: Gerar painel e diário
        # A coleta parcial (--host) grava um instantâneo com um alvo só. Se ela
        # alimentasse o painel, o README público perderia os outros cinco
        # alvos e o diário registraria "alvo saiu da lista" cinco vezes, num
        # arquivo que é permanente. Coleta parcial serve para depurar, não
        # para publicar.
        env:
          HOST: ${{ inputs.host }}
        run: |
          if [ -n "${HOST:-}" ]; then
            echo "::notice::coleta parcial de '${HOST}' — painel e diário não são regenerados"
          else
            python coletor/painel.py
          fi

      - name: Registrar
        run: |
          set -euo pipefail

          # A autoria é do operador do observatório, não de um robô: o e-mail
          # noreply da conta atribui a contribuição sem expor endereço pessoal
          # num repositório público.
          git config user.name  "Paulo Marcos Lucio"
          git config user.email "96093111+Paulo-Marcos-Lucio@users.noreply.github.com"

          git add dados diario README.md

          if git diff --cached --quiet; then
            echo "::warning::coleta não produziu diferença — nada a registrar"
            exit 0
          fi

          MOMENTO=$(date -u +'%Y-%m-%dT%H:%MZ')
          ALVOS=$(python - <<'PY'
          import json, pathlib

          # A contagem sai da SÉRIE, não do último instantâneo: instantâneo só
          # é gravado quando algo muda, então numa hora estável ele seria de
          # outra hora e a mensagem dataria o commit errado.
          linhas = [
              json.loads(l)
              for l in pathlib.Path("dados/serie.jsonl").read_text(encoding="utf-8").splitlines()
              if l.strip()
          ]
          momento = max(r["coletado_em"] for r in linhas)
          agora = [r for r in linhas if r["coletado_em"] == momento]

          # Sonda `pulada` fica fora do denominador: ela não foi tentada, então
          # contá-la como não-conclusiva afirmaria uma falha que não houve.
          estados = [e for r in agora for e in r["sondas"].values() if e != "pulada"]
          ok = sum(1 for e in estados if e == "ok")
          print(f"{len(agora)} alvos, {ok}/{len(estados)} sondas conclusivas")
          PY
          )

          MUDOU=""
          if git diff --cached --name-only | grep -q '^diario/'; then
            MUDOU=" — houve mudança na superfície observada"
          fi

          git commit -m "coleta ${MOMENTO}: ${ALVOS}${MUDOU}"

          # Duas coletas podem se cruzar se uma atrasar na fila do GitHub.
          # O rebase resolve; a série é append-only, então não há conflito real.
          for tentativa in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && break
            sleep 5
          done

          git push origin "HEAD:${GITHUB_REF_NAME}"
