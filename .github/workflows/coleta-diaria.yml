name: Coleta

# Seis coletas por dia, de quatro em quatro horas.
#
# A resolução temporal é o produto aqui. Uma amostra a cada doze horas não
# distingue "o cabeçalho sumiu" de "o cabeçalho sumiu e voltou" — e é
# exatamente nessa janela que mora o deploy revertido às pressas, que é o
# evento mais interessante que um observatório de superfície pode pegar. Com
# quatro horas, uma janela de manutenção típica aparece na série em vez de
# passar entre duas medições.
#
# Custo para o alvo: 4 requisições HTTP por coleta, 24 por dia. Um serviço de
# monitoramento comum bate a cada cinco minutos (288/dia); carregar a página
# inicial uma vez num navegador dispara mais requisições do que isto.
#
# Os minutos são propositalmente quebrados: agendamento no minuto :00 é o
# horário em que o mundo inteiro agenda, e a fila do GitHub atrasa mais ali.
on:
  schedule:
    - cron: "23 2 * * *"    # 23:23 em São Paulo
    - cron: "17 6 * * *"    # 03:17
    - cron: "41 10 * * *"   # 07:41
    - cron: "09 14 * * *"   # 11:09
    - cron: "37 18 * * *"   # 15:37
    - cron: "53 22 * * *"   # 19:53
  workflow_dispatch:
    inputs:
      host:
        description: "Observar só este host (vazio = todos)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  observar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Coletar
        # O input vai por ambiente, nunca por interpolação dentro do `run:`.
        # `${{ inputs.host }}` é substituído como TEXTO pelo runner antes de o
        # bash existir: um host como `x"; curl … | sh; #` viraria comando. É a
        # classe de injeção que o hardening guide do GitHub descreve, e num
        # job com `contents: write` ela entrega o token de escrita do repo.
        env:
          HOST: ${{ inputs.host }}
        run: |
          if [ -n "${HOST:-}" ]; then
            python coletor/coleta.py --host "$HOST"
          else
            python coletor/coleta.py
          fi

      - name: Gerar painel e diário
        # A coleta parcial (--host) grava um instantâneo com um alvo só. Se ela
        # alimentasse o painel, o README público perderia os outros cinco
        # alvos e o diário registraria "alvo saiu da lista" cinco vezes, num
        # arquivo que é permanente. Coleta parcial serve para depurar, não
        # para publicar.
        env:
          HOST: ${{ inputs.host }}
        run: |
          if [ -n "${HOST:-}" ]; then
            echo "::notice::coleta parcial de '${HOST}' — painel e diário não são regenerados"
          else
            python coletor/painel.py
          fi

      - name: Registrar
        run: |
          set -euo pipefail

          # A autoria é do operador do observatório, não de um robô: o e-mail
          # noreply da conta atribui a contribuição sem expor endereço pessoal
          # num repositório público.
          git config user.name  "Paulo Marcos Lucio"
          git config user.email "96093111+Paulo-Marcos-Lucio@users.noreply.github.com"

          git add dados diario README.md

          if git diff --cached --quiet; then
            echo "::warning::coleta não produziu diferença — nada a registrar"
            exit 0
          fi

          MOMENTO=$(date -u +'%Y-%m-%dT%H:%MZ')
          ALVOS=$(python - <<'PY'
          import json, pathlib
          arquivos = sorted(pathlib.Path("dados").glob("*/*/*.json"))
          coleta = json.loads(arquivos[-1].read_text(encoding="utf-8"))
          obs = coleta["observacoes"]
          ok = sum(1 for o in obs for s in o["sondas"] if s["status"] == "ok")
          total = sum(len(o["sondas"]) for o in obs)
          print(f"{len(obs)} alvos, {ok}/{total} sondas conclusivas")
          PY
          )

          MUDOU=""
          if git diff --cached --name-only | grep -q '^diario/'; then
            MUDOU=" — houve mudança na superfície observada"
          fi

          git commit -m "coleta ${MOMENTO}: ${ALVOS}${MUDOU}"

          # Duas coletas podem se cruzar se uma atrasar na fila do GitHub.
          # O rebase resolve; a série é append-only, então não há conflito real.
          for tentativa in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && break
            sleep 5
          done

          git push origin "HEAD:${GITHUB_REF_NAME}"
