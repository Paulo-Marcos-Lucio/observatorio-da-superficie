[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    # O decorador `sonda` captura tudo de propósito: uma sonda que propaga
    # exceção derruba a coleta inteira do dia por causa de um alvo.
    "BLE001",
]

[tool.pytest.ini_options]
testpaths = ["testes"]
